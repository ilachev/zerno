name: Release

on:
  release:
    types: [created]

jobs:
  build:
    name: Verify and Package Release
    runs-on: ubuntu-latest
    env:
      STORAGE_ENGINE: pgsql
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_NAME: app_test
      TEST_DB_USER: app
      TEST_DB_PASSWORD: password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Setup PHP platform
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, pdo_sqlite, pdo_pgsql, sqlite3, pgsql, xml, xmlwriter, zip
          coverage: none
          tools: none
      - name: Verify committed runtime and generated artifacts
        run: php tools/project.php verify:full
      - name: Package runtime sources and bundled runtime dependencies
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: php tools/project.php build "$RELEASE_VERSION"
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/zerno-${{ github.event.release.tag_name }}.tar.gz
            dist/zerno-openapi-${{ github.event.release.tag_name }}.json
          token: ${{ secrets.GITHUB_TOKEN }}
