syntax = "proto3";

package app.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option php_namespace = "App\\Api\\V1";
option php_metadata_namespace = "App\\Api\\V1\\Metadata";
option go_package = "app/api/v1";

// SystemService exposes neutral runtime inspection endpoints for the template core.
service SystemService {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_tag) = {
    description: "Core runtime system endpoints"
  };

  // Describe returns a minimal runtime description using a POST request body.
  rpc Describe(SystemDescribeRequest) returns (SystemDescribeResponse) {
    option (google.api.http) = {
      post: "/api/v1/system/describe"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Describe runtime"
      description: "Returns a neutral runtime description and echoes selected request fields"
      tags: "system"
      responses: {
        key: "200"
        value: {
          description: "Runtime description"
        }
      }
    };
  }
}

// SystemDescribeRequest carries a neutral POST body for testing transport generation.
message SystemDescribeRequest {
  string caller = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Optional caller label to echo in the response"
    example: "\"client\""
  }];
  repeated string requested_capabilities = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Requested runtime capabilities to include when runtime data is enabled"
  }];
  bool include_runtime = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Whether the response should include core runtime capabilities"
  }];
}

// SystemDescribeResponse describes the current neutral runtime state.
message SystemDescribeResponse {
  string name = 1 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Runtime name"
    example: "\"zerno\""
  }];
  string mode = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Runtime mode"
    example: "\"core\""
  }];
  string caller = 3 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Echoed caller value"
    example: "\"client\""
  }];
  repeated string capabilities = 4 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Capabilities included in the neutral runtime description"
  }];
  bool runtime_included = 5 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Whether runtime capabilities were included"
  }];
  int64 timestamp = 6 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    description: "Unix timestamp when the response was created"
    example: "\"1710000000\""
  }];
}
