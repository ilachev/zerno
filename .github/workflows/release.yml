name: Release

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
  build:
    name: Verify and Package Release
    runs-on: ubuntu-latest
    needs: security
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_NAME: app_test
      TEST_DB_USER: app
      TEST_DB_PASSWORD: password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP platform
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, fileinfo, mbstring, pdo_sqlite, pdo_pgsql, sockets, xml, xmlwriter
          coverage: none
          tools: none
      - name: Verify committed runtime and generated artifacts
        run: php tools/project.php verify:full
      - name: Package runtime sources and bundled runtime dependencies
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: php tools/project.php build "$RELEASE_VERSION"
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/zerno-${{ github.event.release.tag_name }}.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
