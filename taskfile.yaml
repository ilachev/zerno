version: '3'

# Optional aliases; PHP is the only required command runner.
vars:
  PHP: php

tasks:
  default:
    cmds:
      - "{{.PHP}} tools/project.php help"

  help:
    desc: Show bundled PHP commands
    cmds:
      - "{{.PHP}} tools/project.php help {{.CLI_ARGS}}"

  verify:
    desc: Run integrity, documentation, style, analysis, SQL and unit checks
    cmds:
      - "{{.PHP}} tools/project.php verify {{.CLI_ARGS}}"

  verify:integration:
    desc: Run PostgreSQL SQL and integration checks
    cmds:
      - "{{.PHP}} tools/project.php verify:integration {{.CLI_ARGS}}"

  verify:full:
    desc: Run every quality gate
    cmds:
      - "{{.PHP}} tools/project.php verify:full {{.CLI_ARGS}}"

  third-party:check:
    desc: Verify bundled dependency hashes
    cmds:
      - "{{.PHP}} tools/project.php third-party:check {{.CLI_ARGS}}"

  docs:check:
    desc: Verify documentation inventory and local Markdown links
    cmds:
      - "{{.PHP}} tools/project.php docs:check {{.CLI_ARGS}}"

  http:check:
    desc: Check real PHP-FPM and RoadRunner HTTP behavior
    cmds:
      - "{{.PHP}} tools/project.php http:check {{.CLI_ARGS}}"

  perf:prepare:
    desc: Create isolated PostgreSQL baseline data
    cmds:
      - "{{.PHP}} tools/project.php perf:prepare {{.CLI_ARGS}}"

  perf:baseline:
    desc: Run the small JSON or SELECT baseline
    cmds:
      - "{{.PHP}} tools/project.php perf:baseline {{.CLI_ARGS}}"

  perf:catalog:
    desc: Run the public catalog HTML scenario
    cmds:
      - "{{.PHP}} tools/project.php perf:catalog {{.CLI_ARGS}}"

  perf:cleanup:
    desc: Remove isolated baseline data
    cmds:
      - "{{.PHP}} tools/project.php perf:cleanup {{.CLI_ARGS}}"

  lint:
    desc: Check PHP style
    cmds:
      - "{{.PHP}} tools/project.php lint {{.CLI_ARGS}}"

  fixcs:
    desc: Fix PHP style
    cmds:
      - "{{.PHP}} tools/project.php fixcs {{.CLI_ARGS}}"

  phpstan:
    desc: Run static analysis
    cmds:
      - "{{.PHP}} tools/project.php phpstan {{.CLI_ARGS}}"

  test:
    desc: Run unit tests
    cmds:
      - "{{.PHP}} tools/project.php test {{.CLI_ARGS}}"

  test:integration:
    desc: Run isolated PostgreSQL integration tests
    cmds:
      - "{{.PHP}} tools/project.php test:integration {{.CLI_ARGS}}"

  test:full:
    desc: Run unit and integration tests
    cmds:
      - "{{.PHP}} tools/project.php test:full {{.CLI_ARGS}}"

  sql:gen:
    desc: Generate typed SQL classes
    cmds:
      - "{{.PHP}} tools/project.php sql:gen {{.CLI_ARGS}}"

  sql:check:
    desc: Check generated SQL synchronization
    cmds:
      - "{{.PHP}} tools/project.php sql:check {{.CLI_ARGS}}"

  sql:check:pg:
    desc: Validate SQL against PostgreSQL
    cmds:
      - "{{.PHP}} tools/project.php sql:check:pg {{.CLI_ARGS}}"

  proto:gen:sdk:
    desc: Generate protobuf PHP SDK
    cmds:
      - "{{.PHP}} tools/project.php proto:gen:sdk {{.CLI_ARGS}}"

  proto:gen:docs:
    desc: Generate OpenAPI documentation
    cmds:
      - "{{.PHP}} tools/project.php proto:gen:docs {{.CLI_ARGS}}"

  proto:gen:endpoints:
    desc: Generate endpoint handlers and registries
    cmds:
      - "{{.PHP}} tools/project.php proto:gen:endpoints {{.CLI_ARGS}}"

  proto:gen:all:
    desc: Generate every protobuf artifact
    cmds:
      - "{{.PHP}} tools/project.php proto:gen:all {{.CLI_ARGS}}"

  tools:sql:lint:
    desc: Check SQL generator style
    cmds:
      - "{{.PHP}} tools/project.php tools:sql:lint {{.CLI_ARGS}}"

  tools:sql:fixcs:
    desc: Fix SQL generator style
    cmds:
      - "{{.PHP}} tools/project.php tools:sql:fixcs {{.CLI_ARGS}}"

  tools:sql:phpstan:
    desc: Analyze SQL generator
    cmds:
      - "{{.PHP}} tools/project.php tools:sql:phpstan {{.CLI_ARGS}}"

  tools:sql:test:
    desc: Test SQL generator
    cmds:
      - "{{.PHP}} tools/project.php tools:sql:test {{.CLI_ARGS}}"

  tools:sql:check:
    desc: Run every SQL generator check
    cmds:
      - "{{.PHP}} tools/project.php tools:sql:check {{.CLI_ARGS}}"

  tools:proto:lint:
    desc: Check protobuf generator style
    cmds:
      - "{{.PHP}} tools/project.php tools:proto:lint {{.CLI_ARGS}}"

  tools:proto:fixcs:
    desc: Fix protobuf generator style
    cmds:
      - "{{.PHP}} tools/project.php tools:proto:fixcs {{.CLI_ARGS}}"

  tools:proto:phpstan:
    desc: Analyze protobuf generator
    cmds:
      - "{{.PHP}} tools/project.php tools:proto:phpstan {{.CLI_ARGS}}"

  tools:proto:test:
    desc: Test protobuf generator
    cmds:
      - "{{.PHP}} tools/project.php tools:proto:test {{.CLI_ARGS}}"

  tools:proto:check:
    desc: Run every protobuf generator check
    cmds:
      - "{{.PHP}} tools/project.php tools:proto:check {{.CLI_ARGS}}"

  migrate:
    desc: Run migrations
    cmds:
      - "{{.PHP}} tools/project.php migrate {{.CLI_ARGS}}"

  cache:clear:
    desc: Clear optional API cache
    cmds:
      - "{{.PHP}} tools/project.php cache:clear {{.CLI_ARGS}}"

  services:start:
    desc: Start Docker services and API migrations
    cmds:
      - "{{.PHP}} tools/project.php services:start {{.CLI_ARGS}}"

  services:stop:
    desc: Stop Docker services
    cmds:
      - "{{.PHP}} tools/project.php services:stop {{.CLI_ARGS}}"

  services:status:
    desc: Show Docker service status
    cmds:
      - "{{.PHP}} tools/project.php services:status {{.CLI_ARGS}}"

  run:
    desc: Run the API through RoadRunner
    cmds:
      - "{{.PHP}} tools/project.php run {{.CLI_ARGS}}"

  perf:test:
    desc: Run a k6 scenario
    cmds:
      - "{{.PHP}} tools/project.php perf:test {{.CLI_ARGS}}"

  perf:test:all:
    desc: Run all k6 scenarios
    cmds:
      - "{{.PHP}} tools/project.php perf:test:all {{.CLI_ARGS}}"

  build:
    desc: Build a runtime release archive
    cmds:
      - "{{.PHP}} tools/project.php build {{.CLI_ARGS}}"
