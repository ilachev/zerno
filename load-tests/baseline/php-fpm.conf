[global]
pid = var/baseline-fpm.pid
error_log = var/baseline-fpm.log
daemonize = no

[baseline]
user = nobody
group = nobody
listen = 127.0.0.1:19001
listen.allowed_clients = 127.0.0.1
pm = static
pm.max_children = 1
pm.max_requests = 0
clear_env = no
catch_workers_output = yes
php_admin_flag[opcache.enable] = on
php_admin_flag[display_errors] = off
